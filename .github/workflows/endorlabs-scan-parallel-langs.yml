              - emails/**/'**/pnpm-lock.yaml'
              - emails/**/'**/rush.json'
              - emails/**/'**/*.js'
              - emails/**/'**/*.ts'
              - emails/**/'**/*.tsx'
            javascript-typescript-root:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
