              - e2e-playwright/**/'**/package-lock.json'
              - e2e-playwright/**/'**/yarn.lock'
              - e2e-playwright/**/'**/pnpm-lock.yaml'
              - e2e-playwright/**/'**/rush.json'
              - e2e-playwright/**/'**/*.js'
              - e2e-playwright/**/'**/*.ts'
              - e2e-playwright/**/'**/*.tsx'
            javascript-typescript-github:
              - .github/**/'**/package.json'
              - .github/**/'**/package-lock.json'
              - .github/**/'**/yarn.lock'
              - .github/**/'**/pnpm-lock.yaml'
              - .github/**/'**/rush.json'
              - .github/**/'**/*.js'
              - .github/**/'**/*.ts'
              - .github/**/'**/*.tsx'
            javascript-typescript-emails:
