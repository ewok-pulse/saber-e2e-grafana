name: Endor Labs Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      go-apps: ${{ steps.filter.outputs.go-apps }}
      go-pkg: ${{ steps.filter.outputs.go-pkg }}
      go-citools: ${{ steps.filter.outputs.go-citools }}
      go-devenv: ${{ steps.filter.outputs.go-devenv }}
      go-scripts: ${{ steps.filter.outputs.go-scripts }}
      go-hack: ${{ steps.filter.outputs.go-hack }}
      go-root: ${{ steps.filter.outputs.go-root }}
      javascript-typescript-packages: ${{ steps.filter.outputs.javascript-typescript-packages }}
      javascript-typescript-public: ${{ steps.filter.outputs.javascript-typescript-public }}
      javascript-typescript-e2e-playwright: ${{ steps.filter.outputs.javascript-typescript-e2e-playwright }}
      javascript-typescript-github: ${{ steps.filter.outputs.javascript-typescript-github }}
      javascript-typescript-emails: ${{ steps.filter.outputs.javascript-typescript-emails }}
      javascript-typescript-root: ${{ steps.filter.outputs.javascript-typescript-root }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            go-apps:
              - apps/**/'**/go.mod'
              - apps/**/'**/go.sum'
              - apps/**/'**/*.go'
            go-pkg:
              - pkg/**/'**/go.mod'
              - pkg/**/'**/go.sum'
              - pkg/**/'**/*.go'
            go-citools:
              - .citools/**/'**/go.mod'
              - .citools/**/'**/go.sum'
              - .citools/**/'**/*.go'
            go-devenv:
              - devenv/**/'**/go.mod'
              - devenv/**/'**/go.sum'
              - devenv/**/'**/*.go'
            go-scripts:
              - scripts/**/'**/go.mod'
              - scripts/**/'**/go.sum'
              - scripts/**/'**/*.go'
            go-hack:
              - hack/**/'**/go.mod'
              - hack/**/'**/go.sum'
              - hack/**/'**/*.go'
            go-root:
              - '**/go.mod'
              - '**/go.sum'
              - '**/*.go'
            javascript-typescript-packages:
              - packages/**/'**/package.json'
              - packages/**/'**/package-lock.json'
              - packages/**/'**/yarn.lock'
              - packages/**/'**/pnpm-lock.yaml'
              - packages/**/'**/rush.json'
              - packages/**/'**/*.js'
              - packages/**/'**/*.ts'
              - packages/**/'**/*.tsx'
            javascript-typescript-public:
              - public/**/'**/package.json'
              - public/**/'**/package-lock.json'
              - public/**/'**/yarn.lock'
              - public/**/'**/pnpm-lock.yaml'
              - public/**/'**/rush.json'
              - public/**/'**/*.js'
              - public/**/'**/*.ts'
              - public/**/'**/*.tsx'
